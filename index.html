<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lacak Paket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .form-box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    textarea,
    button {
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
    }

    select,
    textarea {
      border: 1px solid #d5d5d5;
      padding: 13px;
      margin-bottom: 18px;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 14px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .info {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }

    #hasil {
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 24px;
    }

    .row {
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .value {
      color: #444;
      word-break: break-word;
    }

    .status {
      font-weight: bold;
    }

    .history-button {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .history {
      display: none;
      margin-top: 18px;
      border-top: 1px solid #ddd;
      padding-top: 18px;
    }

    .history-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .history-date {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .history-desc {
      color: #444;
      line-height: 1.5;
    }

    .history-location {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 8px;
    }

    .empty {
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Lacak Paket</h1>
    <p>Cek status pengiriman paket Anda</p>
  </div>

  <div class="form-box">

    <label>Pilih Ekspedisi</label>

    <select id="courier">
      <option value="jne">JNE</option>
      <option value="jnt">J&T Express</option>
      <option value="sicepat">SiCepat</option>
      <option value="anteraja">AnterAja</option>
      <option value="pos">Pos Indonesia</option>
      <option value="tiki">TIKI</option>
      <option value="wahana">Wahana</option>
      <option value="ninja">Ninja Xpress</option>
      <option value="lion">Lion Parcel</option>
      <option value="idexpress">ID Express</option>
      <option value="spx">Shopee Express</option>
      <option value="jnt_cargo">J&T Cargo</option>
    </select>

    <label>Nomor Resi</label>

    <textarea
      id="resi"
      placeholder="Masukkan nomor resi, satu resi per baris

Contoh:
004639699228
123456789
987654321"></textarea>

    <div class="info">
      Maksimal 55 resi dalam satu kali pencarian.
    </div>

    <button id="btnLacak" onclick="lacakResi()">
      Lacak Paket
    </button>

  </div>

  <div id="hasil"></div>

</div>


<script>

const WORKER_URL =
  "https://proud-sun-00d0.adyoga65.workers.dev";


async function lacakResi() {

  const courier =
    document.getElementById("courier").value;

  const input =
    document.getElementById("resi").value;

  const hasil =
    document.getElementById("hasil");

  const button =
    document.getElementById("btnLacak");

  let resiList =
    input
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(x => x !== "");


  if (resiList.length === 0) {

    hasil.innerHTML =
      '<div class="error">Masukkan nomor resi terlebih dahulu.</div>';

    return;
  }


  if (resiList.length > 55) {

    hasil.innerHTML =
      '<div class="error">Maksimal 55 resi.</div>';

    return;
  }


  hasil.innerHTML = "";

  button.disabled = true;

  button.textContent =
    "Sedang melacak...";


  for (let i = 0; i < resiList.length; i++) {

    const awb = resiList[i];

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h3>Resi #${i + 1}</h3>

      <div class="loading">
        Memeriksa ${escapeHtml(awb)}...
      </div>
    `;

    hasil.appendChild(card);


    try {

      const url =
        `${WORKER_URL}/api/track` +
        `?courier=${encodeURIComponent(courier)}` +
        `&awb=${encodeURIComponent(awb)}`;


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.message || "Gagal mengambil data."
        );

      }


      card.innerHTML =
        tampilkanHasil(data, awb, i);


    } catch (error) {

      card.innerHTML = `
        <h3>Resi #${i + 1}</h3>

        <div class="error">
          Gagal mengambil data tracking.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

    }

  }


  button.disabled = false;

  button.textContent =
    "Lacak Paket";
}


function tampilkanHasil(data, awb, nomor) {

  const paket =
    data.data || {};

  const summary =
    paket.summary || {};

  const detail =
    paket.detail || {};

  const history =
    Array.isArray(paket.history)
      ? paket.history
      : [];


  const penerima =
    detail.receiver || "-";

  const alamat =
    detail.destination || "-";

  const noResi =
    summary.awb || awb;

  const seller =
    detail.shipper || "-";

  const status =
    summary.status || "-";


  let historyHTML = "";


  if (history.length === 0) {

    historyHTML =
      `<div class="empty">
        Riwayat perjalanan tidak tersedia.
      </div>`;

  } else {

    historyHTML =
      history.map(item => {

        return `
          <div class="history-item">

            <div class="history-date">
              ${escapeHtml(item.date || "-")}
            </div>

            <div class="history-desc">
              ${escapeHtml(item.desc || "-")}
            </div>

            ${
              item.location
              ? `
                <div class="history-location">
                  ${escapeHtml(item.location)}
                </div>
              `
              : ""
            }

          </div>
        `;

      }).join("");

  }


  return `

    <h3>Hasil Tracking</h3>


    <div class="row">

      <span class="label">
        Nama Penerima :
      </span>

      <span class="value">
        ${escapeHtml(penerima)}
      </span>

    </div>


    <div class="row">

      <span class="label">
        Alamat :
      </span>

      <span class="value">
        ${escapeHtml(alamat)}
      </span>

    </div>


    <div class="row">

      <span class="label">
        No Resi :
      </span>

      <span class="value">
        ${escapeHtml(noResi)}
      </span>

    </div>


    <div class="row">

      <span class="label">
        Seller :
      </span>

      <span class="value">
        ${escapeHtml(seller)}
      </span>

    </div>


    <div class="row">

      <span class="label">
        Status :
      </span>

      <span class="value status">
        ${escapeHtml(status)}
      </span>

    </div>


    <button
      class="history-button"
      onclick="toggleHistory(${nomor})">

      Lihat riwayat perjalanan

    </button>


    <div
      id="history-${nomor}"
      class="history">

      ${historyHTML}

    </div>

  `;
}


function toggleHistory(nomor) {

  const element =
    document.getElementById(
      `history-${nomor}`
    );


  if (element.style.display === "block") {

    element.style.display = "none";

  } else {

    element.style.display = "block";

  }

}


function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
